<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Bias-aware review pipeline</title>
  <desc id="desc">Feedback flows through synthesis, evidence grounding, bias audit, and human approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1d3147"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path d="M235 130H315M535 130H615M835 130H915"/>
  </g>
  <g fill="#fbbf24" filter="url(#glow)">
    <circle r="6" cy="130"><animate attributeName="cx" values="235;315;235" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="6" cy="130"><animate attributeName="cx" values="535;615;535" dur="3s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle r="6" cy="130"><animate attributeName="cx" values="835;915;835" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(145 130)"><circle r="82" fill="#17263a" stroke="#60a5fa" stroke-width="2"/><text y="-10" fill="#fff" font-size="18" font-weight="700">360° Feedback</text><text y="20" fill="#a9bfd5" font-size="13">many voices, one file</text></g>
    <g transform="translate(445 130)"><circle r="82" fill="#17263a" stroke="#60a5fa" stroke-width="2"/><text y="-10" fill="#fff" font-size="18" font-weight="700">Synthesis Agent</text><text y="20" fill="#a9bfd5" font-size="13">claims + citations</text></g>
    <g transform="translate(745 130)"><circle r="82" fill="#17263a" stroke="#fbbf24" stroke-width="2"/><text y="-10" fill="#fff" font-size="18" font-weight="700">Bias Audit</text><text y="20" fill="#a9bfd5" font-size="13">flags + reasoning</text></g>
    <g transform="translate(1045 130)"><circle r="82" fill="#17263a" stroke="#34d399" stroke-width="2"/><text y="-10" fill="#fff" font-size="18" font-weight="700">Human Gate</text><text y="20" fill="#a9bfd5" font-size="13">edit, acknowledge, approve</text></g>
  </g>
</svg>
