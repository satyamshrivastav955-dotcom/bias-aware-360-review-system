<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Bias detection in action</title>
  <desc id="d">A manager claim is scanned against evidence and flagged as a contradiction.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#1a2436"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#60a5fa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="g2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font: 600 15px ui-monospace, "Cascadia Code", Consolas, monospace; }
      .small { font: 500 12px ui-monospace, Consolas, monospace; }
      .label { font: 700 11px ui-monospace, Consolas, monospace; letter-spacing: .14em; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg2)"/>

  <!-- Manager claim card -->
  <g>
    <rect x="60" y="46" width="420" height="96" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="84" y="78" class="label" fill="#94a3b8">MANAGER FEEDBACK · 2026-07</text>
    <text x="84" y="112" class="mono" fill="#f8fafc">&#8220;Arjun consistently misses</text>
    <text x="84" y="132" class="mono" fill="#f8fafc">deadlines.&#8221;</text>
  </g>

  <!-- Scan beam sweeping the claim -->
  <rect x="60" y="46" width="420" height="96" rx="14" fill="url(#scan)">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.1;.3;.4;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -90;0 90;0 -90" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Agent node -->
  <g filter="url(#g2)">
    <circle cx="600" cy="94" r="34" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5">
      <animate attributeName="stroke" values="#60a5fa;#fbbf24;#f87171;#60a5fa" keyTimes="0;.35;.6;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="99" text-anchor="middle" class="label" fill="#e2e8f0">AUDIT</text>
  </g>
  <path d="M480 94H566" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M634 94H720" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Verdict card -->
  <g>
    <rect x="720" y="40" width="420" height="108" rx="14" fill="#2a1215" stroke="#7f1d1d" stroke-width="2">
      <animate attributeName="stroke" values="#7f1d1d;#ef4444;#7f1d1d" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="744" y="72" class="label" fill="#fca5a5">&#9888; HIGH SEVERITY · CONTRADICTION</text>
    <text x="744" y="100" class="small" fill="#fecaca">Contradicted by objective delivery evidence.</text>
    <text x="744" y="122" class="small" fill="#fecaca">Approval blocked until reviewed by a human.</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.55;.65;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Evidence cards sliding in -->
  <g class="small">
    <g>
      <rect x="60" y="196" width="340" height="54" rx="10" fill="#0f2417" stroke="#166534" stroke-width="1.5"/>
      <text x="80" y="218" class="label" fill="#86efac">GOAL_1 · COMPLETED</text>
      <text x="80" y="238" fill="#bbf7d0">Dashboard shipped 20 Mar &#8212; on time</text>
      <animateTransform attributeName="transform" type="translate" values="-40 0;0 0" keyTimes="0;1" dur=".5s" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.15;.25;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="430" y="196" width="340" height="54" rx="10" fill="#0f2417" stroke="#166534" stroke-width="1.5"/>
      <text x="450" y="218" class="label" fill="#86efac">PROJECT_2 · ON SCHEDULE</text>
      <text x="450" y="238" fill="#bbf7d0">Component library, 25 Feb &#8212; on time</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.25;.35;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="800" y="196" width="340" height="54" rx="10" fill="#1f2410 " stroke="#854d0e" stroke-width="1.5"/>
      <text x="820" y="218" class="label" fill="#fde68a">MEETING NOTE · JUNE</text>
      <text x="820" y="238" fill="#fef3c7">Covering two engineers on leave</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.45;1" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Connector from evidence up to verdict -->
  <path d="M600 196V148" stroke="#475569" stroke-width="2" stroke-dasharray="4 6" opacity=".8">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="298" text-anchor="middle" class="label" fill="#64748b">EVERY CLAIM IS CHECKED AGAINST THE EVIDENCE THAT CITES IT</text>
  <text x="600" y="320" text-anchor="middle" class="small" fill="#475569">unsupported claim &#183; recency bias &#183; single-source bias &#183; vague language &#183; contradiction</text>
</svg>
